name: desktop-build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DGWENT_WITH_SDL=OFF -DGWENT_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2 development files
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - name: Configure frontend
        run: cmake -S . -B build-sdl -DGWENT_WITH_SDL=ON -DGWENT_BUILD_TESTS=ON
      - name: Build frontend and engine
        run: cmake --build build-sdl --parallel
      - name: Test
        run: ctest --test-dir build-sdl --output-on-failure
      - name: Decode reference SFX
        run: SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy ./build-sdl/gwent --audio-test
      - name: Frontend smoke test
        run: SDL_VIDEODRIVER=dummy ./build-sdl/gwent --smoke-test frontend-smoke.bmp deck-builder-smoke.bmp card-details-smoke.bmp card-flight-smoke.bmp deck-select-smoke.bmp title-smoke.bmp leader-choice-smoke.bmp leader-reveal-smoke.bmp
      - name: Miyoo software-composition smoke test
        run: SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy GWENT_SOFTWARE_COMPOSITE=1 ./build-sdl/gwent --smoke-test composite-frontend-smoke.bmp composite-deck-builder-smoke.bmp composite-card-details-smoke.bmp composite-card-flight-smoke.bmp composite-deck-select-smoke.bmp composite-title-smoke.bmp composite-leader-choice-smoke.bmp composite-leader-reveal-smoke.bmp
      - name: Upload frontend smoke frames
        uses: actions/upload-artifact@v4
        with:
          name: frontend-smoke-frames
          path: |
            frontend-smoke.bmp
            deck-builder-smoke.bmp
            card-details-smoke.bmp
            card-flight-smoke.bmp
            deck-select-smoke.bmp
            title-smoke.bmp
            leader-choice-smoke.bmp
            leader-reveal-smoke.bmp
            composite-frontend-smoke.bmp
            composite-deck-builder-smoke.bmp
            composite-card-details-smoke.bmp
            composite-card-flight-smoke.bmp
            composite-deck-select-smoke.bmp
            composite-title-smoke.bmp
            composite-leader-choice-smoke.bmp
            composite-leader-reveal-smoke.bmp
          if-no-files-found: error
          retention-days: 7
