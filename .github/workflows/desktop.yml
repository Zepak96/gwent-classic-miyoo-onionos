name: desktop-build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DGWENT_WITH_SDL=OFF -DGWENT_BUILD_TESTS=ON -DGWENT_CAMPAIGN_BENCHMARK=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Campaign draft balance comparison
        run: ./build/gwent_campaign_benchmark > campaign-balance.csv
      - name: Summarize campaign progression
        run: python3 tools/campaign_balance_report.py campaign-balance.csv campaign-balance.md
      - uses: actions/upload-artifact@v4
        with:
          name: campaign-balance
          path: |
            campaign-balance.csv
            campaign-balance.md
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2 development files
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev
      - name: Configure frontend
        run: cmake -S . -B build-sdl -DGWENT_WITH_SDL=ON -DGWENT_BUILD_TESTS=ON
      - name: Build frontend and engine
        run: cmake --build build-sdl --parallel
      - name: Test
        run: ctest --test-dir build-sdl --output-on-failure
      - name: Decode effects and background music
        run: SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy ./build-sdl/gwent --audio-test
      - name: Frontend smoke test
        run: SDL_VIDEODRIVER=dummy ./build-sdl/gwent --smoke-test frontend-smoke.bmp deck-builder-smoke.bmp card-details-smoke.bmp card-flight-smoke.bmp deck-builder-settings-smoke.bmp deck-builder-back-smoke.bmp leader-choice-smoke.bmp leader-reveal-smoke.bmp pause-smoke.bmp mulligan-smoke.bmp
      - name: Main menu rendering and navigation
        run: SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy ./build-sdl/gwent --menu-smoke-test main-menu-smoke.bmp
      - name: Main menu software composition
        run: SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy GWENT_SOFTWARE_COMPOSITE=1 ./build-sdl/gwent --menu-smoke-test composite-main-menu-smoke.bmp
      - name: Crowded board texture stability
        run: SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy ./build-sdl/gwent --crowded-render-test
      - name: Crowded board software composition
        run: SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy GWENT_SOFTWARE_COMPOSITE=1 ./build-sdl/gwent --crowded-render-test
      - name: Board focus rendering
        run: SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy ./build-sdl/gwent --board-focus-smoke-test board-focus-smoke.bmp
      - name: Campaign ladder navigation and fixed opponent
        run: SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy ./build-sdl/gwent --campaign-smoke-test campaign-smoke.bmp
      - name: Campaign software composition
        run: SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy GWENT_SOFTWARE_COMPOSITE=1 ./build-sdl/gwent --campaign-smoke-test composite-campaign-smoke.bmp
      - name: Miyoo physical-key mapping
        run: SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy ./build-sdl/gwent --input-test
      - name: Round and match result screens
        run: SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy ./build-sdl/gwent --result-smoke-test round-result-win.bmp round-result-loss.bmp round-result-draw.bmp round-result-nilfgaard-tiebreak.bmp match-result-draw.bmp
      - name: Miyoo software-composition smoke test
        run: SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy GWENT_SOFTWARE_COMPOSITE=1 ./build-sdl/gwent --smoke-test composite-frontend-smoke.bmp composite-deck-builder-smoke.bmp composite-card-details-smoke.bmp composite-card-flight-smoke.bmp composite-deck-builder-settings-smoke.bmp composite-deck-builder-back-smoke.bmp composite-leader-choice-smoke.bmp composite-leader-reveal-smoke.bmp composite-pause-smoke.bmp composite-mulligan-smoke.bmp
      - name: Upload frontend smoke frames
        uses: actions/upload-artifact@v4
        with:
          name: frontend-smoke-frames
          path: |
            campaign-smoke.bmp
            composite-campaign-smoke.bmp
            board-focus-smoke.bmp
            main-menu-smoke.bmp
            composite-main-menu-smoke.bmp
            frontend-smoke.bmp
            deck-builder-smoke.bmp
            card-details-smoke.bmp
            card-flight-smoke.bmp
            deck-builder-settings-smoke.bmp
            deck-builder-back-smoke.bmp
            leader-choice-smoke.bmp
            leader-reveal-smoke.bmp
            pause-smoke.bmp
            mulligan-smoke.bmp
            round-result-win.bmp
            round-result-loss.bmp
            round-result-draw.bmp
            round-result-nilfgaard-tiebreak.bmp
            match-result-draw.bmp
            composite-frontend-smoke.bmp
            composite-deck-builder-smoke.bmp
            composite-card-details-smoke.bmp
            composite-card-flight-smoke.bmp
            composite-deck-builder-settings-smoke.bmp
            composite-deck-builder-back-smoke.bmp
            composite-leader-choice-smoke.bmp
            composite-leader-reveal-smoke.bmp
            composite-pause-smoke.bmp
            composite-mulligan-smoke.bmp
          if-no-files-found: error
          retention-days: 7
